name: Docker build

on:
  push:
    branches: [ci]
  pull_request:
    branches: [ci]

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: cerebro:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image metadata
        run: docker image inspect cerebro:ci
